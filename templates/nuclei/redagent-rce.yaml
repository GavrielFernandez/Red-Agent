id: redagent-rce-detection
info:
  author: RedAgent
  description: Detects remote code execution vulnerabilities
  name: RCE Detection
  severity: critical
  tags:
  - rce
  - injection
  - redagent
requests:
- matchers:
  - regex:
    - uid=[0-9]+.*gid=[0-9]+
    - 'root:x:0:0:'
    type: regex
  method: GET
  path:
  - /?cmd=id
  - /?exec=whoami
  - /?command=cat /etc/passwd
